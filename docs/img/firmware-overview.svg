<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img"><title>Firmware overview</title><desc>Boot, join, main loop and night deep sleep</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="700" fill="#ffffff"/><rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" x="340.0" y="42.0" text-anchor="middle" dominant-baseline="central">Boot</text><line x1="340" y1="64" x2="340" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="90" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" x="340.0" y="109.0" text-anchor="middle" dominant-baseline="central">Setup</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" x="340.0" y="129.0" text-anchor="middle" dominant-baseline="central">NVS, Zigbee radio always on</text><line x1="340" y1="146" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="172" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" x="340.0" y="191.0" text-anchor="middle" dominant-baseline="central">Wait for join</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">blue LED blinking</text><rect x="520" y="172" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="590.0" y="191.0" text-anchor="middle" dominant-baseline="central">BOOT 3 s</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" x="590.0" y="211.0" text-anchor="middle" dominant-baseline="central">factory reset</text><line x1="520" y1="200" x2="482" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="340" y1="228" x2="340" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="254" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" x="340.0" y="273.0" text-anchor="middle" dominant-baseline="central">After the join</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" x="340.0" y="293.0" text-anchor="middle" dominant-baseline="central">time, OTA, laser on</text><line x1="340" y1="310" x2="340" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="336" width="600" height="262" rx="20" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" x="64" y="362" text-anchor="start" dominant-baseline="central">Main loop</text><rect x="60" y="382" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="195.0" y="401.0" text-anchor="middle" dominant-baseline="central">Switch to sleepy</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="195.0" y="421.0" text-anchor="middle" dominant-baseline="central">20 s after join</text><rect x="350" y="382" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="485.0" y="401.0" text-anchor="middle" dominant-baseline="central">Config from Z2M</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="485.0" y="421.0" text-anchor="middle" dominant-baseline="central">save to NVS, re-apply</text><rect x="60" y="452" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="195.0" y="471.0" text-anchor="middle" dominant-baseline="central">Laser</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="195.0" y="491.0" text-anchor="middle" dominant-baseline="central">report on change</text><rect x="350" y="452" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="485.0" y="471.0" text-anchor="middle" dominant-baseline="central">Battery</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="485.0" y="491.0" text-anchor="middle" dominant-baseline="central">laser stopped, median</text><rect x="60" y="522" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="195.0" y="541.0" text-anchor="middle" dominant-baseline="central">Status and LED</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="195.0" y="561.0" text-anchor="middle" dominant-baseline="central">charger, green, blink</text><rect x="350" y="522" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="485.0" y="541.0" text-anchor="middle" dominant-baseline="central">Time and OTA</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="485.0" y="561.0" text-anchor="middle" dominant-baseline="central">resync every 6 h</text><line x1="340" y1="598" x2="340" y2="622" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="624" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="340.0" y="643.0" text-anchor="middle" dominant-baseline="central">Night deep sleep</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" x="340.0" y="663.0" text-anchor="middle" dominant-baseline="central">only if enabled</text></svg>