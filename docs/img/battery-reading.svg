<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 370" width="380" height="370" role="img"><title>Battery reading sequence</title><desc>Stop laser, wait, sample, median, restart laser and publish</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="380" height="370" fill="#ffffff"/><rect x="40" y="20" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="190.0" y="37.0" text-anchor="middle" dominant-baseline="central">1. Stop the laser</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="190.0" y="57.0" text-anchor="middle" dominant-baseline="central">no current spikes</text><line x1="190" y1="72" x2="190" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="92" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="190.0" y="109.0" text-anchor="middle" dominant-baseline="central">2. Wait 150 ms</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="190.0" y="129.0" text-anchor="middle" dominant-baseline="central">the divider settles</text><line x1="190" y1="144" x2="190" y2="162" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="164" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" x="190.0" y="181.0" text-anchor="middle" dominant-baseline="central">3. Read 15 ADC samples</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" x="190.0" y="201.0" text-anchor="middle" dominant-baseline="central">1 ms apart</text><line x1="190" y1="216" x2="190" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="236" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" x="190.0" y="253.0" text-anchor="middle" dominant-baseline="central">4. Take the median</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" x="190.0" y="273.0" text-anchor="middle" dominant-baseline="central">discards radio spikes</text><line x1="190" y1="288" x2="190" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="308" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="190.0" y="325.0" text-anchor="middle" dominant-baseline="central">5. Restart the laser</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="190.0" y="345.0" text-anchor="middle" dominant-baseline="central">then publish volts and percentage</text></svg>