<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290" role="img"><title>Laser cycle timing</title><desc>Laser measures 100 ms then rests; the ESP32 sleeps then reads the result</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="380" height="290" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="60" y="22" text-anchor="middle" dominant-baseline="central">0</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="200" y="22" text-anchor="middle" dominant-baseline="central">500 ms</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="340" y="22" text-anchor="middle" dominant-baseline="central">1000 ms</text><line x1="60" y1="30" x2="60" y2="170" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/><line x1="200" y1="30" x2="200" y2="170" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/><line x1="340" y1="30" x2="340" y2="170" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" x="20" y="52" text-anchor="start" dominant-baseline="central">Laser: 100 ms measuring, 400 ms resting</text><rect x="60" y="62" width="28" height="22" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><rect x="88" y="62" width="112" height="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><rect x="200" y="62" width="28" height="22" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><rect x="228" y="62" width="112" height="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" x="20" y="116" text-anchor="start" dominant-baseline="central">ESP32: sleeps, then polls and reads</text><rect x="60" y="126" width="28" height="22" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="88" y="126" width="6" height="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><rect x="94" y="126" width="126" height="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><rect x="220" y="126" width="8" height="22" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="228" y="126" width="6" height="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><rect x="234" y="126" width="106" height="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><line x1="91" y1="148" x2="91" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="231" y1="148" x2="231" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="20" y="204" text-anchor="start" dominant-baseline="central">Report to Z2M only if the distance</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="20" y="222" text-anchor="start" dominant-baseline="central">changes by at least 2 cm</text><rect x="20" y="248" width="12" height="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="40" y="254" text-anchor="start" dominant-baseline="central">measuring</text><rect x="110" y="248" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="130" y="254" text-anchor="start" dominant-baseline="central">rest / sleep</text><rect x="238" y="248" width="12" height="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="258" y="254" text-anchor="start" dominant-baseline="central">reading</text><rect x="20" y="268" width="12" height="12" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="3 2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="40" y="274" text-anchor="start" dominant-baseline="central">check every 10 ms while waiting for the data</text><text font-family="Helvetica, Arial, sans-serif" font-size="1" fill="#444441" x="360" y="52" text-anchor="start" dominant-baseline="central"></text></svg>