# =========================================================================
# Project: esphome-zigbee-tof-awning-sensor
# Hardware: Waveshare ESP32-H2-Zero + VL53L1X ToF Laser Sensor
# Description: Low-power Zigbee distance monitor for motorized awnings
# =========================================================================
external_components:
  - source: github://damienmorrissey/esphome-vl53l1x
    components: [vl53l1x]

esphome:
  name: esphome-zigbee-tof-awning-senso
  friendly_name: esphome-zigbee-tof-awning-sensor
  on_boot:
    priority: -100
    then:
      lambda: id(deep_sleep_module).set_sleep_duration(id(sleep_duration_ms));

esp32:
  board: esp32-h2-devkitm-1
  framework:
    type: esp-idf

# Native Zigbee stack configuration (end device, battery powered)
zigbee:
  id: my_zigbee
  router: false

# --- DYNAMIC PARAMETERS STORED IN FLASH MEMORY ---
# NOTE: these have no WiFi/API and Zigbee "number" is not supported on ESP32,
# so they only act as documented defaults — change initial_value and reflash
# to adjust them, there is no remote control path today.
globals:
  # Awning calibration values (stored in millimeters)
  - id: awning_closed_zero
    type: float
    restore_value: yes
    initial_value: '200.0'   # Default: 20cm
  - id: awning_max_length
    type: float
    restore_value: yes
    initial_value: '2200.0'  # Default: 220cm
  # Deep sleep duration applied between every wake cycle, day and night alike (in milliseconds)
  - id: sleep_duration_ms
    type: int
    restore_value: yes
    initial_value: '1800000' # Default: 30 minutes (30 * 60 * 1000)

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

# --- CONFIGURATION ENTITIES (on-device defaults, see NOTE above) ---
number:
  # 1. Closed Position Calibration Zero Point
  - platform: template
    name: "Awning Closed Position Zero"
    unit_of_measurement: "cm"
    icon: "mdi:arrow-collapse-left"
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 20
    set_action:
      lambda: id(awning_closed_zero) = x * 10.0; # Converts input cm to mm

  # 2. Maximum Awning Length Calibration
  - platform: template
    name: "Awning Max Length"
    unit_of_measurement: "cm"
    icon: "mdi:arrow-expand-right"
    min_value: 100
    max_value: 400
    step: 5
    initial_value: 220
    set_action:
      lambda: id(awning_max_length) = x * 10.0; # Converts input cm to mm

  # 3. Deep Sleep Duration (applied continuously, no day/night distinction)
  - platform: template
    name: "Deep Sleep Duration"
    unit_of_measurement: "min"
    icon: "mdi:moon-waning-crescent"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 30
    set_action:
      lambda: |-
        id(sleep_duration_ms) = x * 60 * 1000;
        id(deep_sleep_module).set_sleep_duration(id(sleep_duration_ms));

  # 4. Laser Distance Reading Interval (Adjusts local poll rate)
  - platform: template
    name: "Laser Poll Interval"
    unit_of_measurement: "ms"
    icon: "mdi:timer-sand"
    min_value: 100
    max_value: 5000
    step: 100
    initial_value: 500
    set_action:
      lambda: |-
        // Dynamically adjusts the update interval of the physical VL53L1X sensor
        id(raw_laser_distance).set_update_interval(x);

# --- TELEMETRY SENSORS (Exposed as Sensor entities via Zigbee) ---
# Physical ToF Laser Sensor Component (VL53L1X)
sensor:
  - platform: vl53l1x
    id: raw_laser_distance
    distance_mode: LONG
    timing_budget: 50ms
    enable_pin: GPIO5
    update_interval: 500ms
    filters:
      # Only transmits data via Zigbee radio if the awning shifts by more than 2 cm
      # This saves massive battery power when the awning is completely stationary
      - delta: 0.02

  # 5. CALCULATED AWNING POSITION (0% Closed - 100% Fully Open)
  - platform: template
    name: "Awning Opening Percentage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:storefront-outline"
    endpoint: 1
    lambda: |-
      if (isnan(id(raw_laser_distance).state)) return {};
      float d = id(raw_laser_distance).state * 1000.0; // Raw measurement in mm

      // Enforce the calibration bounds stored in globals
      if (d < id(awning_closed_zero)) d = id(awning_closed_zero);
      if (d > id(awning_max_length)) d = id(awning_max_length);

      return ((d - id(awning_closed_zero)) / (id(awning_max_length) - id(awning_closed_zero))) * 100.0;

  # 6. BATTERY VOLTAGE
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 60s
    endpoint: 2
    filters:
      # Multiplier to scale the voltage back up from the 100k/100k hardware voltage divider
      - multiply: 2.0

  # 7. BATTERY PERCENTAGE
  - platform: template
    name: "Battery Percentage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    update_interval: 60s
    endpoint: 3
    lambda: |-
      if (isnan(id(battery_voltage).state)) return {};
      float v = id(battery_voltage).state;
      float r = ((v - 3.2) / (4.2 - 3.2)) * 100.0; // Standard 3.2V (Empty) to 4.2V (100% Full) Li-Ion scale
      if (r > 100.0) r = 100.0;
      if (r < 0.0) r = 0.0;
      return r;

# --- UNCONDITIONED DEEP SLEEP DUTY CYCLE ---
# No clock/network involved: the device always wakes, transmits, and sleeps
# for a fixed duration, forever. run_duration triggers deep sleep automatically
# once it elapses; sleep_duration is overridden at boot from sleep_duration_ms
# (see esphome: on_boot above).
deep_sleep:
  id: deep_sleep_module
  run_duration: 15s       # Stays awake for 15s to read the sensor and broadcast updates
  sleep_duration: 30min   # Default sleep length; overridden at boot from sleep_duration_ms
